name: Security Vulnerability Check

on:
  push:
    branches:
      - Dev
      - main
  pull_request:
    branches:
      - Dev
      - main

permissions:
  contents: read
  security-events: write

jobs:
  security-scan:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install security scan tools
        run: python -m pip install bandit pip-audit

      - name: Scan files with Trivy
        id: trivy
        uses: aquasecurity/trivy-action@0.28.0
        with:
          scan-type: fs
          scan-ref: .
          format: sarif
          output: trivy-results.sarif
          severity: CRITICAL,HIGH
          exit-code: "1"
        continue-on-error: true

      - name: Scan Python code with Bandit
        id: bandit
        run: bandit -r src airflow/dags
        continue-on-error: true

      - name: Scan dependencies with pip-audit
        id: dependencies
        run: pip-audit -r requirements.txt
        continue-on-error: true

      - name: Upload Trivy results
        if: always() && hashFiles('trivy-results.sarif') != ''
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-results.sarif

      - name: Fail if a security scan failed
        if: always() && (steps.trivy.outcome == 'failure' || steps.bandit.outcome == 'failure' || steps.dependencies.outcome == 'failure')
        run: exit 1
